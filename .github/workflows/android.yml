name: Build LeanEmojiTV APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOriginDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanEmojiTV-debug-apk
          path: leankeykeyboard/build/outputs/apk/origin/debug/*.apk
          if-no-files-found: error
          retention-days: 14
